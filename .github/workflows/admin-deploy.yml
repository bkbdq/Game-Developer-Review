name: admin-deploy

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdr-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:admin-review && npm run test:artwork
      - name: Configure shared DeepSeek search on production Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          printf '%s' "$DEEPSEEK_API_KEY" | npx --yes wrangler@4.165.0 pages secret put DEEPSEEK_API_KEY --project-name gdr-admin
      - name: Deploy admin Pages and Functions
        run: npm run deploy:admin
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
