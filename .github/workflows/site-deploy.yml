name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /
      PUBLIC_REVIEW_REQUEST_ENDPOINT: https://goodcorp.games/api/requests
      PUBLIC_CONTACT_ENDPOINT: https://goodcorp.games/api/contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run data:build
      - run: npm run build --workspace site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
