<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
  <title>数据维护 · 审核控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar"><div class="bar-inner">
    <a class="brand" href="/">goodcorp</a><span class="divider"></span>
    <a href="/">审核控制台</a><span class="crumb">/</span><span>数据维护</span>
    <a class="topbar-link" href="/requests.html">申请 / 联系</a>
    <a class="topbar-link" href="/audit.html">审计日志</a>
    <a id="pending-changes-link" class="topbar-link" href="/?tab=changes">待审改动（0）</a>
    <span class="user-slot"><span id="user-label"></span></span>
    <button id="logout-button" type="button" class="bar-ghost" hidden>退出</button>
  </div></header>

  <main>
    <section id="boot-view" class="panel login boot" aria-live="polite">
      <h1><span class="boot-spinner" aria-hidden="true"></span>正在进入数据维护…</h1>
      <p>正在确认登录状态，通常无需重新输入 token。</p>
      <p id="boot-status" class="status" role="status">正在验证登录状态…</p>
      <div id="boot-actions" class="actions" hidden>
        <button id="boot-retry" type="button">重试</button>
        <button id="boot-login" type="button" class="ghost">重新登录</button>
      </div>
    </section>

    <section id="login-view" class="panel login" hidden>
      <h1>管理员登录</h1>
      <p>使用与审核台相同的 GitHub PAT。登录后 30 天内免登录。</p>
      <form id="login-form">
        <label for="token">GitHub Token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit" class="primary">登录</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </section>

    <section id="app-view" hidden>
      <div class="data-tabs" role="tablist" aria-label="数据维护分类">
        <button type="button" class="tab active" data-view="reviews">评价（<span id="tab-review-count">0</span>）</button>
        <button type="button" class="tab" data-view="companies">公司（<span id="tab-company-count">0</span>）</button>
        <button type="button" class="tab" data-view="projects">项目（<span id="tab-project-count">0</span>）</button>
      </div>

      <!-- 评价 -->
      <section id="view-reviews">
        <div class="toolbar data-toolbar">
          <input id="review-search" type="search" placeholder="搜索公司 / 项目 / 标题 / 正文" autocomplete="off">
          <select id="review-company-filter" aria-label="按公司筛选"><option value="">全部公司</option></select>
          <select id="review-project-filter" aria-label="按项目筛选"><option value="">全部项目</option></select>
          <select id="review-score-filter" aria-label="按评分筛选">
            <option value="">全部评分</option>
            <option value="5">5 星</option>
            <option value="4">4 星</option>
            <option value="3">3 星</option>
            <option value="2">2 星</option>
            <option value="1">1 星</option>
          </select>
          <button id="review-refresh" type="button" class="ghost">刷新</button>
          <span id="review-count" class="count"></span>
        </div>

        <div class="panel data-panel">
          <div class="table-wrap">
            <table class="data-table review-table">
              <thead>
                <tr>
                  <th>公司</th>
                  <th>项目</th>
                  <th>评价</th>
                  <th>评分</th>
                  <th>发布日期</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="review-rows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 公司 -->
      <section id="view-companies" hidden>
        <div class="toolbar data-toolbar">
          <input id="company-search" type="search" placeholder="搜索公司名 / ID / slug / 别名" autocomplete="off">
          <button id="company-refresh" type="button" class="ghost">刷新</button>
          <span id="company-count" class="count"></span>
        </div>

        <div class="panel data-panel">
          <div class="table-wrap">
            <table class="data-table company-table">
              <thead>
                <tr>
                  <th>公司名称</th>
                  <th>别名</th>
                  <th>项目数</th>
                  <th>评价数</th>
                  <th>最近更新</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="company-rows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 项目 -->
      <section id="view-projects" hidden>
        <div class="toolbar data-toolbar">
          <input id="project-search" type="search" placeholder="搜索项目名 / 别名 / 项目 ID / 公司" autocomplete="off">
          <select id="project-company-filter" aria-label="按公司筛选"><option value="">全部公司</option></select>
          <button id="project-new-button" type="button" class="ghost">＋ 新增项目</button>
          <button id="project-refresh" type="button" class="ghost">刷新</button>
          <span id="project-count" class="count"></span>
        </div>

        <div id="project-new-form" class="panel new-project-form" hidden>
          <div class="grid">
            <label>所属公司
              <select id="new-project-company"></select>
            </label>
            <label>项目名
              <input id="new-project-name" maxlength="50" autocomplete="off">
            </label>
            <label>状态
              <select id="new-project-status">
                <option value="live">已上线</option>
                <option value="dev">在研</option>
                <option value="cancelled">已取消</option>
                <option value="unknown">状态未知</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button id="new-project-add" type="button" class="primary">添加</button>
            <button id="new-project-cancel" type="button" class="ghost">取消</button>
          </div>
        </div>

        <div class="panel data-panel">
          <div class="table-wrap">
            <table class="data-table project-table">
              <thead>
                <tr>
                  <th>项目名称</th>
                  <th>别名</th>
                  <th>公司名称</th>
                  <th>状态</th>
                  <th>评价数量</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="project-rows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <p id="global-status" class="status" role="status"></p>
    </section>
  </main>

  <dialog id="review-dialog" class="modal" aria-labelledby="review-dialog-title">
    <form id="review-dialog-form">
      <header class="modal-head">
        <h2 id="review-dialog-title">修改评价</h2>
        <button id="review-dialog-close" type="button" class="ghost small">关闭</button>
      </header>
      <p id="review-dialog-meta" class="count"></p>

      <div class="grid">
        <label>公司
          <input id="review-dialog-company" readonly>
        </label>
        <label>项目
          <select id="review-dialog-project"></select>
        </label>
        <label>评分
          <select id="review-dialog-score">
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
          </select>
        </label>
      </div>

      <label>标题（选填，40 字以内）
        <input id="review-dialog-title-input" maxlength="40" autocomplete="off">
      </label>

      <label>评价正文
        <textarea id="review-dialog-comment" rows="8" maxlength="2000"></textarea>
      </label>
      <p id="review-dialog-sensitive" class="status" role="status"></p>

      <div class="grid">
        <label>发布日期
          <input id="review-dialog-date" type="date">
        </label>
        <label>在职时长
          <select id="review-dialog-tenure">
            <option value="">不填</option>
          </select>
        </label>
      </div>

      <fieldset>
        <legend>标签</legend>
        <div id="review-dialog-tags" class="checks"></div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary">保存修改</button>
        <button id="review-dialog-revert" type="button" class="ghost">还原</button>
        <button id="review-dialog-cancel" type="button" class="ghost">取消</button>
      </div>
      <p id="review-dialog-status" class="status" role="status"></p>
    </form>
  </dialog>

  <dialog id="company-dialog" class="modal" aria-labelledby="company-dialog-title">
    <form id="company-dialog-form">
      <header class="modal-head">
        <h2 id="company-dialog-title">修改公司</h2>
        <button id="company-dialog-close" type="button" class="ghost small">关闭</button>
      </header>
      <p id="company-dialog-meta" class="count"></p>

      <label>公司名
        <input id="company-dialog-name" maxlength="50" autocomplete="off">
      </label>
      <label>slug（公司页 URL）
        <input id="company-dialog-slug" autocomplete="off" spellcheck="false">
      </label>
      <label>别名（逗号分隔，仅用于站内搜索）
        <input id="company-dialog-aliases" autocomplete="off">
      </label>

      <div class="actions">
        <button type="submit" class="primary">保存修改</button>
        <button id="company-dialog-cancel" type="button" class="ghost">取消</button>
        <button id="company-dialog-delete" type="button" class="danger">删除公司</button>
      </div>
      <p id="company-dialog-delete-hint" class="status"></p>
      <p id="company-dialog-status" class="status" role="status"></p>
    </form>
  </dialog>

  <dialog id="project-dialog" class="modal" aria-labelledby="project-dialog-title">
    <form id="project-dialog-form">
      <header class="modal-head">
        <h2 id="project-dialog-title">修改项目</h2>
        <button id="project-dialog-close" type="button" class="ghost small">关闭</button>
      </header>
      <p id="project-dialog-meta" class="count"></p>

      <div class="grid">
        <label>公司
          <input id="project-dialog-company" readonly>
        </label>
        <label>项目名称
          <input id="project-dialog-name" maxlength="50" autocomplete="off">
        </label>
        <label>状态
          <select id="project-dialog-status">
            <option value="live">已上线</option>
            <option value="dev">在研</option>
            <option value="cancelled">已取消</option>
            <option value="unknown">状态未知</option>
          </select>
        </label>
      </div>

      <label>别名（逗号分隔，仅用于站内搜索）
        <input id="project-dialog-aliases" autocomplete="off">
      </label>

      <div class="actions">
        <button type="submit" class="primary">保存修改</button>
        <button id="project-dialog-cancel" type="button" class="ghost">取消</button>
      </div>
      <p id="project-dialog-message" class="status" role="status"></p>
    </form>
  </dialog>

  <script type="module" src="/data.js"></script>
</body>
</html>
