<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
  <title>审核控制台 · 游戏行业匿名评价</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>审核控制台</strong><span id="user-label"></span></div>
    <div class="topbar-actions">
      <a class="topbar-link" href="/audit.html">审计日志</a>
      <a class="topbar-link" href="/requests.html">申请 / 联系</a>
      <button id="logout-button" type="button" class="ghost" hidden>退出</button>
    </div>
  </header>

  <main>
    <section id="login-view" class="panel login">
      <h1>管理员登录</h1>
      <p>粘贴 PAT。仓库主人用 fine-grained token（Contents 读写）；仓库协作者用 classic token（勾选 repo）。token 只保存在当前标签页的 sessionStorage，关闭标签页后失效。</p>
      <form id="login-form">
        <label for="token">GitHub Token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit">登录</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </section>

    <section id="app-view" hidden>
      <section class="overview" aria-label="待处理总览">
        <button id="overview-pending" type="button" class="overview-card">
          <span class="overview-label">待审评价</span>
          <strong id="count-pending">0</strong>
          <small>去审核</small>
        </button>
        <a id="overview-requests" class="overview-card" href="/requests.html?tab=requests">
          <span class="overview-label">删除 / 更正</span>
          <strong id="count-requests">0</strong>
          <small>去处理</small>
        </a>
        <a id="overview-contacts" class="overview-card" href="/requests.html?tab=contacts">
          <span class="overview-label">联系消息</span>
          <strong id="count-contacts">0</strong>
          <small>去查看</small>
        </a>
      </section>

      <div class="toolbar">
        <input id="filter" type="search" placeholder="搜索公司或项目" autocomplete="off">
        <button id="refresh-button" type="button" class="ghost">刷新</button>
        <button id="deploy-button" type="button" class="ghost" hidden>更新展示站</button>
        <span id="pending-count" class="count"></span>
      </div>

      <div class="layout">
        <aside class="panel list" aria-label="待审列表">
          <div class="tabs">
            <button id="tab-pending" type="button" class="tab active">待审</button>
            <button id="tab-staged" type="button" class="tab">暂存</button>
          </div>
          <div id="staged-bar" class="staged-bar" hidden>
            <span id="staged-summary"></span>
            <button id="publish-batch-button" type="button">全部发布</button>
          </div>
          <div id="pending-list"></div>
          <button id="load-more" type="button" class="ghost" hidden>加载更多</button>
        </aside>

        <section class="panel detail">
          <div id="detail-empty" class="empty">选择左侧一条待审提交</div>

          <form id="review-form" hidden>
            <div id="submission-summary" class="summary"></div>

            <div class="grid">
              <div class="field">
                <span class="field-title">公司</span>
                <div class="combo">
                  <input id="company-input" type="search" placeholder="搜索公司：名称 / ID / 别名 / 项目" autocomplete="off" spellcheck="false">
                  <div id="company-list" class="combo-list" hidden></div>
                </div>
              </div>
              <div class="field">
                <span class="field-title">项目</span>
                <div class="combo">
                  <input id="project-input" type="search" placeholder="搜索项目：名称 / ID / 别名" autocomplete="off" spellcheck="false">
                  <div id="project-list" class="combo-list" hidden></div>
                </div>
              </div>
            </div>

            <div id="new-company" class="subpanel" hidden>
              <div class="grid">
                <label>公司 ID <input id="new-company-id" placeholder="c_xxx" autocomplete="off"></label>
                <label>slug <input id="new-company-slug" placeholder="mihoyo" autocomplete="off"></label>
                <label>公司名 <input id="new-company-name" maxlength="50" autocomplete="off"></label>
              </div>
            </div>

            <div id="new-project" class="subpanel" hidden>
              <div class="grid">
                <label>项目 ID <input id="new-project-id" placeholder="p_xxx" autocomplete="off"></label>
                <label>项目名 <input id="new-project-name" maxlength="50" autocomplete="off"></label>
                <label>状态
                  <select id="new-project-status">
                    <option value="live">已上线</option>
                    <option value="dev">在研</option>
                    <option value="cancelled">已取消</option>
                    <option value="unknown">未知</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="grid">
              <label>评分
                <select id="review-score">
                  <option value="5">5</option>
                  <option value="4">4</option>
                  <option value="3">3</option>
                  <option value="2">2</option>
                  <option value="1">1</option>
                </select>
              </label>
              <label>标题（选填） <input id="review-title" maxlength="40" autocomplete="off"></label>
            </div>

            <label>在职时长（选填，四区间）
              <select id="profile-tenure"></select>
            </label>

            <label>评价正文
              <textarea id="review-comment" rows="8" maxlength="2000"></textarea>
            </label>
            <div id="comment-preview" class="preview" hidden></div>
            <p id="sensitive-status" class="status" role="status"></p>

            <fieldset>
              <legend>标签</legend>
              <div id="tag-list" class="checks"></div>
            </fieldset>

            <div id="similar-box" class="similar" hidden></div>

            <fieldset>
              <legend>发布前检查（全部勾选才能通过或暂存）</legend>
              <div id="checklist" class="checks vertical">
                <label><input type="checkbox" class="check-item" value="pii"> 不含真实姓名、联系方式、身份证号、住址</label>
                <label><input type="checkbox" class="check-item" value="secret"> 不含未公开的项目代号、内部系统名或商业秘密</label>
                <label><input type="checkbox" class="check-item" value="attack"> 不含人身攻击、侮辱性表述</label>
                <label><input type="checkbox" class="check-item" value="attribution"> 公司与项目归属正确，正文与所选对象一致</label>
              </div>
            </fieldset>

            <div class="actions">
              <button id="approve-button" type="submit">通过并发布</button>
              <button id="stage-button" type="button" class="ghost">暂存</button>
              <button id="reject-button" type="button" class="danger">拒绝</button>
            </div>

            <div id="reject-panel" class="subpanel" hidden>
              <label>拒绝原因（只进内部记录，不通知提交者）
                <select id="reject-reason"></select>
              </label>
              <label id="reject-note-row" hidden>补充说明（选「其他」时必填）
                <input id="reject-note" maxlength="100" autocomplete="off">
              </label>
              <div class="actions">
                <button id="reject-confirm" type="button" class="danger">确认拒绝</button>
                <button id="reject-cancel" type="button" class="ghost">取消</button>
              </div>
            </div>

            <p id="detail-status" class="status" role="status"></p>
          </form>
        </section>
      </div>
    </section>

    <p id="global-status" class="status" role="status"></p>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
