<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
  <title>已展示数据 · 审核控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="topbar-link" href="/">← 审核台</a>
      <strong>已展示数据</strong>
      <span id="user-label"></span>
    </div>
    <div class="topbar-actions">
      <a class="topbar-link" href="/requests.html">申请 / 联系</a>
      <a class="topbar-link" href="/audit.html">审计日志</a>
      <button id="logout-button" type="button" class="ghost" hidden>退出</button>
    </div>
  </header>

  <main>
    <section id="boot-view" class="panel login boot" aria-live="polite">
      <h1><span class="boot-spinner" aria-hidden="true"></span>正在进入已展示数据…</h1>
      <p>正在确认登录状态，通常无需重新输入 token。</p>
      <p id="boot-status" class="status" role="status">正在验证登录状态…</p>
      <div id="boot-actions" class="actions" hidden>
        <button id="boot-retry" type="button">重试</button>
        <button id="boot-login" type="button" class="ghost">重新登录</button>
      </div>
    </section>

    <section id="login-view" class="panel login" hidden>
      <h1>管理员登录</h1>
      <p>使用与审核台相同的 GitHub PAT。登录后 30 天内免登录。</p>
      <form id="login-form">
        <label for="token">GitHub Token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit">登录</button>
      </form>
      <p id="login-status" class="status" role="status"></p>
    </section>

    <section id="app-view" hidden>
      <div class="toolbar">
        <input id="filter" type="search" placeholder="搜索公司：名称 / ID / slug / 别名 / 项目" autocomplete="off">
        <button id="refresh-button" type="button" class="ghost">刷新</button>
        <span id="company-count" class="count"></span>
      </div>

      <div class="layout">
        <aside id="company-list" class="panel list" aria-label="已展示公司"></aside>

        <section class="panel detail">
          <div id="detail-empty" class="empty">选择左侧一家公司，修正展示信息</div>

          <div id="company-detail" hidden>
            <div class="published-head">
              <div>
                <h2 id="company-name-label"></h2>
                <p id="company-meta" class="count"></p>
              </div>
              <span id="company-badge" class="badge"></span>
            </div>

            <form id="company-form">
              <div class="grid">
                <label>公司名 <input id="company-field-name" maxlength="50" autocomplete="off"></label>
                <label>slug（公司页 URL） <input id="company-field-slug" autocomplete="off" spellcheck="false"></label>
              </div>
              <label>别名（用于站内搜索，不对外展示；用逗号分隔）
                <input id="company-field-aliases" autocomplete="off">
              </label>

              <div class="published-section">
                <div class="section-head">
                  <h3>项目</h3>
                  <button id="add-project-button" type="button" class="ghost small">＋ 添加项目</button>
                </div>
                <div id="project-rows"></div>
              </div>

              <div class="actions">
                <button id="save-company-button" type="submit">保存公司信息</button>
                <button id="reset-company-button" type="button" class="ghost">还原</button>
              </div>
              <p id="company-status" class="status" role="status"></p>
            </form>

            <div class="published-section">
              <div class="section-head">
                <h3>已展示评价（<span id="review-count">0</span>）</h3>
                <button id="reload-reviews-button" type="button" class="ghost small">重新加载评价</button>
              </div>
              <div id="review-list"></div>
            </div>

            <form id="review-form" hidden>
              <div class="section-head">
                <h3>编辑评价 <span id="review-id-label" class="count"></span></h3>
                <button id="close-review-button" type="button" class="ghost small">关闭</button>
              </div>

              <div class="grid">
                <label>评分
                  <select id="review-score">
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                  </select>
                </label>
                <label>关联项目
                  <select id="review-project"></select>
                </label>
                <label>发布日期
                  <input id="review-published-at" type="date">
                </label>
              </div>

              <label>标题（选填，40 字以内）
                <input id="review-title" maxlength="40" autocomplete="off">
              </label>

              <label>评价正文
                <textarea id="review-comment" rows="8" maxlength="2000"></textarea>
              </label>
              <p id="review-sensitive" class="status" role="status"></p>

              <label>在职时长
                <select id="review-tenure"></select>
              </label>

              <fieldset>
                <legend>标签</legend>
                <div id="review-tags" class="checks"></div>
              </fieldset>

              <div class="actions">
                <button id="save-review-button" type="submit">保存修改</button>
                <button id="delete-review-button" type="button" class="danger">删除这条评价</button>
                <button id="cancel-review-button" type="button" class="ghost">取消</button>
              </div>
              <p id="review-status" class="status" role="status"></p>
            </form>
          </div>
        </section>
      </div>
    </section>

    <p id="global-status" class="status" role="status"></p>
  </main>

  <script type="module" src="/published.js"></script>
</body>
</html>
